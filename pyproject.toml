[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "keelson-connector-pc"
version = "0.1.0"
description = "Keelson/Zenoh connector publishing computer health: CPU, memory, storage, network, sensors"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    # 0.6.0rc15 is the PEP440 spelling of the 0.6.0-pre.15 tag -- the same
    # build the rest of the fleet runs (ghcr.io/rise-maritime/keelson:0.6.0-pre.15).
    # Required, not merely preferred: it is the first release carrying the
    # three-tier liveliness API this connector declares its subjects with.
    "keelson>=0.6.0rc15",
    "psutil>=6.0",
    "pyyaml",
]

[project.scripts]
pc2keelson = "keelson_connector_pc.cli:main"

[project.optional-dependencies]
dev = [
    "black==25.9.0",
    "pylint==4.0.2",
    "pytest==8.3.4",
]

[tool.setuptools.packages.find]
# `where` is explicit because it defaults to the build's working directory. A
# build run from / (as a Dockerfile without a WORKDIR does) then walks the
# whole filesystem looking for packages before applying `include`.
where = ["."]
include = ["keelson_connector_pc*"]

[tool.setuptools.package-data]
keelson_connector_pc = ["subjects.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "e2e: end-to-end test that opens a real Zenoh session",
]

[tool.black]
extend-exclude = '_pb2\.py'
